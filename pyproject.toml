[project]
name = "sharedmem"
version = "0.1.0"
description = "Shared memory MCP server for multi-agent collaboration"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "chromadb>=0.5.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharedmem"]
