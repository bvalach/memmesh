# SharedMem example configuration
# Copy this file to config.yaml (or config.local.yaml) and adapt the paths.

data_dir: data
watch: true
debounce_seconds: 2.0
chunk_max_chars: 2000

sources:
  notes:
    path: /path/to/notes
    patterns:
      - "**/*.md"
    exclude:
      - ".trash/"
    type: notes

  agent_memory:
    path: /path/to/agent-memory
    patterns:
      - "**/memory/**/*.md"
      - "**/MEMORY.md"
    type: agent_memory

  skills:
    path: /path/to/skills
    patterns:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
    type: skill

  repo_docs:
    path: /path/to/repos
    patterns:
      - "*/CLAUDE.md"
      - "*/AGENTS.md"
      - "*/README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
    exclude:
      - ".git/"
      - "node_modules/"
      - ".venv/"
    type: project_config
